.theme-swatch.green{background:linear-gradient(145deg,#24301f,#121910);color:#a9bd78}.theme-swatch.black{background:linear-gradient(145deg,#20242a,#090b0e);color:#d0d4d8}.theme-swatch.blue{background:linear-gradient(145deg,#1c3246,#0d1721);color:#78bbed}.theme-swatch.yellow{background:linear-gradient(145deg,#352d14,#141107);color:#e1b33b}
.theme-choice strong{display:block;font-size:11px}.theme-choice small{display:block;margin-top:3px;color:var(--muted);font-size:8px;line-height:1.3}.theme-check{position:absolute;top:9px;right:9px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);font-size:11px;color:transparent}.theme-choice.active .theme-check{color:var(--gold);border-color:rgba(var(--gold-rgb),.35);background:var(--gold-soft)}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(20px);opacity:.5}to{transform:translateY(0);opacity:1}}
@media(max-width:380px){.container{padding-left:12px;padding-right:12px}.axis-grid{gap:8px}.axis-card{min-height:164px;padding:13px}.axis-title{font-size:15px}.duration-chips{grid-template-columns:repeat(3,1fr)}}
@media(min-width:620px){.axis-card{min-height:184px}.axis-title{font-size:20px;max-width:210px}.axis-subtitle{max-width:220px}.axis-grid{gap:12px}}
@media(max-width:699px){input,select,textarea{font-size:16px}}
</style>
</head>
<body>
<div class="music-watermark" aria-hidden="true">𝄢 ♪ ♫ ♩ ♭ ♯</div>
<header class="app-header">
  <div class="header-inner">
    <div class="brand-row">
      <div class="brand-mark" aria-hidden="true">𝄢</div>
      <div>
        <h1 id="screenTitle">Baixo</h1>
        <div id="screenSubtitle"></div>
      </div>
    </div>
  </div>
</header>
<input type="file" id="importFile" accept=".json" hidden onchange="handleImport(event)">
<main class="container">
  <section id="homeScreen"></section>
  <section id="historyScreen" class="hidden"></section>
  <section id="progressScreen" class="hidden"></section>
  <section id="moreScreen" class="hidden"></section>
</main>
<div id="modalContainer"></div>
<div id="toastContainer" class="toast-wrap" aria-live="polite"></div>
<nav class="bottom-nav" aria-label="Navegação principal">
  <button class="nav-item active" id="navHome" onclick="showHome()"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg><span>Registrar</span></button>
  <button class="nav-item" id="navHistory" onclick="showHistory()"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg><span>Histórico</span></button>
  <button class="nav-item" id="navProgress" onclick="showProgress()"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg><span>Progresso</span></button>
  <button class="nav-item" id="navMore" onclick="showMore()"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/></svg><span>Mais</span></button>
</nav>
<script>
const DEFAULT_AXES = [
  {
    id:'e1',number:1,title:'Domínio técnico',subtitle:'Fundamentos de execução',symbol:'𝄢',
    subareas:[
      {id:'e1-i01',code:'01',name:'Exercício de independência dos dedos',group:'Técnica de mão direita e esquerda',metric:'bpm',goals:[100],units:['Exercício 1','Exercício 2','Exercício 3'],archived:false},
      {id:'e1-i03',code:'03',name:'Grooves pra treinar sua digitação',group:'Precisão rítmica e groove',metric:'bpm',goals:[80,100,120],units:['Groove 1','Groove 2','Groove 3','Groove 4','Groove 5'],archived:false},
      {id:'e1-tecnica',code:'T',name:'Técnica de mão direita e esquerda',group:'Conteúdo central',metric:'none',goals:[],units:[],archived:false},
      {id:'e1-ritmo',code:'R',name:'Precisão rítmica e groove',group:'Conteúdo central',metric:'none',goals:[],units:[],archived:false},
      {id:'e1-percepcao',code:'P',name:'Percepção musical',group:'Conteúdo central',metric:'none',goals:[],units:[],archived:false},
      {id:'e1-ouvido',code:'O',name:'Treinamento de ouvido',group:'Conteúdo central',metric:'none',goals:[],units:[],archived:false}
    ]
  },
  {
    id:'e2',number:2,title:'Visão harmônica',subtitle:'Compreensão musical',symbol:'♭',
    subareas:[
      {id:'e2-triades',code:'01',name:'Tríades e tétrades',group:'Compreensão musical',metric:'none',goals:[],units:[],archived:false},
      {id:'e2-campo',code:'02',name:'Campo harmônico maior e menor',group:'Compreensão musical',metric:'none',goals:[],units:[],archived:false},
      {id:'e2-funcoes',code:'03',name:'Funções harmônicas',group:'Compreensão musical',metric:'none',goals:[],units:[],archived:false},
      {id:'e2-dominantes',code:'04',name:'Dominantes secundárias',group:'Compreensão musical',metric:'none',goals:[],units:[],archived:false},
      {id:'e2-estendidos',code:'05',name:'Acordes estendidos',group:'Compreensão musical',metric:'none',goals:[],units:[],archived:false}
    ]
  },
  {
    id:'e3',number:3,title:'Fluência nas escalas',subtitle:'Fluência no instrumento',symbol:'♯',
    subareas:[
      {id:'e3-penta',code:'01',name:'Pentatônicas',group:'Fluência no instrumento',metric:'none',goals:[],units:[],archived:false},
      {id:'e3-modos',code:'02',name:'Modos gregos',group:'Fluência no instrumento',metric:'none',goals:[],units:[],archived:false},
      {id:'e3-menores',code:'03',name:'Menor harmônica e melódica',group:'Fluência no instrumento',metric:'none',goals:[],units:[],archived:false},
      {id:'e3-aplicacao',code:'04',name:'Aplicação das escalas',group:'Fluência no instrumento',metric:'none',goals:[],units:[],archived:false},
      {id:'e3-braco',code:'05',name:'Desenvolvimento pelo braço inteiro',group:'Fluência no instrumento',metric:'none',goals:[],units:[],archived:false}
    ]
  },
  {
    id:'e4',number:4,title:'Criação musical',subtitle:'Expressão musical',symbol:'♫',
    subareas:[
      {id:'e4-fraseado',code:'01',name:'Fraseado',group:'Expressão musical',metric:'none',goals:[],units:[],archived:false},
      {id:'e4-musicalidade',code:'02',name:'Musicalidade',group:'Expressão musical',metric:'none',goals:[],units:[],archived:false},
      {id:'e4-escolhas',code:'03',name:'Escolhas criativas',group:'Expressão musical',metric:'none',goals:[],units:[],archived:false},
      {id:'e4-linguagem',code:'04',name:'Construção de linguagem musical',group:'Expressão musical',metric:'none',goals:[],units:[],archived:false}
    ]
  }
];

let axes = loadJSON('baixo_axes',null) || structuredCloneSafe(DEFAULT_AXES);
let records = loadJSON('baixo_records',[]);
let selectedDate = localISO();
let calendarMonth = new Date().getMonth();
let calendarYear = new Date().getFullYear();
let currentScreen='home';
let selectedUnits=[];
let toastTimer=null;
const THEME_META={
  green:{name:'Verde escuro',desc:'Oliva, profundo e sóbrio',themeColor:'#151c13'},
  black:{name:'Preto',desc:'Neutro e contrastado',themeColor:'#0d0f12'},
  blue:{name:'Azul',desc:'Frio, escuro e profundo',themeColor:'#101923'},
  yellow:{name:'Amarelo',desc:'Âmbar sobre fundo escuro',themeColor:'#1c190d'}
};
let currentTheme=THEME_META[document.documentElement.dataset.theme]?document.documentElement.dataset.theme:'black';

function loadJSON(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch{return fallback}}
function save(){localStorage.setItem('baixo_axes',JSON.stringify(axes));localStorage.setItem('baixo_records',JSON.stringify(records))}
function structuredCloneSafe(v){return JSON.parse(JSON.stringify(v))}
function localISO(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function nowTime(){const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function escapeHTML(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function inlineArg(v){return JSON.stringify(String(v??'')).replace(/&/g,'\\u0026').replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/"/g,'&quot;')}
function formatMin(min){min=Number(min)||0;if(min<60)return `${min} min`;const h=Math.floor(min/60),m=min%60;return m?`${h}h ${m}min`:`${h}h`}
function formatDateBR(iso){if(!iso)return'';const [y,m,d]=iso.split('-').map(Number);return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'long',year:'numeric'}).format(new Date(y,m-1,d))}
function startOfWeek(d=new Date()){const x=new Date(d);const day=x.getDay();const diff=(day===0?-6:1-day);x.setDate(x.getDate()+diff);x.setHours(0,0,0,0);return x}
function showToast(msg,type='ok'){const h=document.getElementById('toastContainer');clearTimeout(toastTimer);h.innerHTML=`<div class="toast ${type==='error'?'error':''}">${escapeHTML(msg)}</div>`;toastTimer=setTimeout(()=>h.innerHTML='',2200)}
function applyTheme(theme){
  if(!THEME_META[theme])return;
  currentTheme=theme;document.documentElement.dataset.theme=theme;
  try{localStorage.setItem('baixo_theme',theme)}catch(e){}
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',THEME_META[theme].themeColor);
  document.querySelectorAll('.theme-choice').forEach(el=>el.classList.toggle('active',el.dataset.theme===theme));
}
function openAppearance(){
  showModal('Aparência',`<p class="section-copy" style="margin-top:-5px;margin-bottom:13px">Escolha o visual do app. A preferência fica salva neste aparelho.</p><div class="theme-grid">${Object.entries(THEME_META).map(([key,t])=>`<button class="theme-choice ${currentTheme===key?'active':''}" data-theme="${key}" onclick="applyTheme('${key}')"><span class="theme-check">✓</span><span class="theme-swatch ${key}"></span><strong>${t.name}</strong><small>${t.desc}</small></button>`).join('')}</div>`,'Personalização');
}
function axisById(id){return axes.find(a=>a.id===id)}
function subById(axisId,subId){return axisById(axisId)?.subareas.find(s=>s.id===subId)}
function activeSubs(axis){return axis.subareas.filter(s=>!s.archived)}
function weekRecords(){const start=startOfWeek();const end=new Date(start);end.setDate(end.getDate()+7);return records.filter(r=>{const d=new Date(`${r.date}T12:00:00`);return d>=start&&d<end})}
function sumDuration(list){return list.reduce((s,r)=>s+(Number(r.duration)||0),0)}
function uniqueDays(list){return new Set(list.map(r=>r.date)).size}

function setHeader(title,subtitle=''){document.getElementById('screenTitle').textContent=title;document.getElementById('screenSubtitle').textContent=subtitle}
function setNav(screen){['Home','History','Progress','More'].forEach(x=>document.getElementById(`nav${x}`)?.classList.remove('active'));const map={home:'Home',history:'History',progress:'Progress',more:'More'};document.getElementById(`nav${map[screen]}`)?.classList.add('active')}
function showOnly(id){['homeScreen','historyScreen','progressScreen','moreScreen'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
function showHome(){currentScreen='home';showOnly('homeScreen');setNav('home');setHeader('Baixo',new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'}).format(new Date()));renderHome()}
function showHistory(){currentScreen='history';showOnly('historyScreen');setNav('history');setHeader('Histórico','Sessões e registros por dia');renderHistory()}
function showProgress(){currentScreen='progress';showOnly('progressScreen');setNav('progress');setHeader('Progresso','Tempo, frequência e objetivos mensuráveis');renderProgress()}
function showMore(){currentScreen='more';showOnly('moreScreen');setNav('more');setHeader('Mais','Curso, dados e manutenção');renderMore()}

function renderHome(){
  const host=document.getElementById('homeScreen');
  const wr=weekRecords();
  const total=sumDuration(wr);
  const sessions=wr.length;
  const days=uniqueDays(wr);
  host.innerHTML=`
    <div class="card hero">
      <div class="hero-main">
        <div><div class="eyebrow">Plano mestre</div><h2 class="section-title">Seu estudo, registrado em segundos.</h2><p class="section-copy">Escolha um eixo, a subárea e registre o que foi feito.</p></div>
        <div style="text-align:right"><div class="hero-stat">${formatMin(total)}</div><div class="hero-label">esta semana</div></div>
      </div>
      <div class="hero-metrics">
        <div class="metric"><b>${sessions}</b><span>registros</span></div>
        <div class="metric"><b>${days}</b><span>dias</span></div>
        <div class="metric"><b>${records.length}</b><span>total</span></div>
      </div>
    </div>
    <div class="eyebrow" style="margin:4px 2px 9px">Registrar treino</div>
    <div class="axis-grid">${axes.map(axis=>{
      const mins=sumDuration(wr.filter(r=>r.axisId===axis.id));
      return `<button class="axis-card" data-symbol="${escapeHTML(axis.symbol)}" onclick="openAxis(${inlineArg(axis.id)})">
        <div class="axis-number">Eixo ${axis.number}</div>
        <div class="axis-title">${escapeHTML(axis.title)}</div>
        <div class="axis-subtitle">${escapeHTML(axis.subtitle)}</div>
        <div class="axis-footer"><span class="axis-time">${formatMin(mins)} na semana</span><span class="axis-arrow">›</span></div>
      </button>`}).join('')}</div>`;
}

function showModal(title,body,kicker='Registro'){
  document.getElementById('modalContainer').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-content"><div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-head-copy"><div class="sheet-kicker">${escapeHTML(kicker)}</div><div class="sheet-title">${escapeHTML(title)}</div></div><button class="sheet-close" onclick="closeModal()" aria-label="Fechar">×</button></div>${body}</div></div>`;
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modalContainer').innerHTML='';document.body.style.overflow=''}

function openAxis(axisId){
  const axis=axisById(axisId);if(!axis)return;
  const subs=activeSubs(axis);
  showModal(`Eixo ${axis.number} — ${axis.title}`,`
    <p class="section-copy" style="margin-top:-5px">Selecione o conteúdo treinado.</p>
    <div class="subarea-list">${subs.map(s=>`<button class="subarea-btn" onclick="openRecordForm(${inlineArg(axis.id)},${inlineArg(s.id)})"><span class="sub-code">${escapeHTML(s.code||'•')}</span><span class="sub-copy"><strong>${escapeHTML(s.name)}</strong><span>${escapeHTML(s.group||axis.subtitle)}</span></span><span class="sub-chevron">›</span></button>`).join('')}</div>
  `,`Eixo ${axis.number}`);
}

function openRecordForm(axisId,subId,recordId=null){
  const axis=axisById(axisId),sub=subById(axisId,subId);if(!axis||!sub)return;
  const existing=recordId?records.find(r=>String(r.id)===String(recordId)):null;
  selectedUnits=existing?.units?[...existing.units]:[];
  const goals=(sub.goals||[]).filter(Number.isFinite);
  const unitHtml=(sub.units||[]).length?`<div class="form-label">Parte treinada <small>marque uma ou mais</small></div><div class="unit-grid" id="unitGrid">${sub.units.map(u=>`<button type="button" class="unit-chip ${selectedUnits.includes(u)?'active':''}" data-unit="${escapeHTML(u)}" onclick="toggleUnit(this)">${escapeHTML(u)}</button>`).join('')}</div>`:'';
  const metricHtml=sub.metric==='bpm'?`<div class="form-label">BPM trabalhado <small>opcional</small></div><input id="recordMetric" type="number" min="20" max="400" inputmode="numeric" placeholder="Ex.: 70" value="${existing?.metricValue??''}">${goals.length?`<div class="goal-strip">${goals.map((g,i)=>`<div class="goal-pill">${i===0?'1ª meta':`${i+1}ª meta`}: ${g} BPM</div>`).join('')}</div>`:''}`:'';
  showModal(existing?'Editar registro':sub.name,`
    <div class="sheet-meta"><span class="mini-tag gold">Eixo ${axis.number}</span><span class="mini-tag">${escapeHTML(sub.group||axis.subtitle)}</span></div>
    <div style="height:15px"></div>
    ${unitHtml}${metricHtml}
    <div class="form-row"><div><div class="form-label">Data</div><input id="recordDate" type="date" value="${existing?.date||localISO()}"></div><div><div class="form-label">Hora</div><input id="recordTime" type="time" value="${existing?.startTime||nowTime()}"></div></div>
    <div class="form-label">Duração <small>minutos</small></div>
    <div class="duration-chips">${[10,20,30,45,60].map(n=>`<button type="button" class="chip ${(existing?.duration===n)?'active':''}" onclick="setDuration(${n},this)">${n}</button>`).join('')}</div>
    <input id="recordDuration" type="number" min="1" max="600" inputmode="numeric" placeholder="Duração em minutos" value="${existing?.duration??''}">
    <div class="form-label">Nota <small>opcional</small></div><textarea id="recordNotes" placeholder="Como foi o treino? O que travou? O que melhorou?">${escapeHTML(existing?.notes||'')}</textarea>
    <button class="primary" onclick="saveRecord(${inlineArg(axisId)},${inlineArg(subId)},${recordId?inlineArg(recordId):'null'})">${existing?'Salvar alterações':'Salvar registro'}</button>
    ${existing?`<div style="height:9px"></div><button class="secondary danger" onclick="deleteRecord(${inlineArg(recordId)})">Excluir registro</button>`:''}
  `,existing?'Edição':`Eixo ${axis.number}`);
}
function toggleUnit(el){const u=el.dataset.unit;const i=selectedUnits.indexOf(u);if(i>=0)selectedUnits.splice(i,1);else selectedUnits.push(u);el.classList.toggle('active')}
function setDuration(n,el){document.getElementById('recordDuration').value=n;document.querySelectorAll('.duration-chips .chip').forEach(x=>x.classList.toggle('active',x===el))}
function saveRecord(axisId,subId,recordId){
  const sub=subById(axisId,subId);if(!sub)return;
  const date=document.getElementById('recordDate').value;
  const startTime=document.getElementById('recordTime').value;
  const duration=Number(document.getElementById('recordDuration').value)||0;
  const notes=document.getElementById('recordNotes').value.trim();
  const metricValue=sub.metric==='bpm'?(Number(document.getElementById('recordMetric')?.value)||null):null;
  if(!date||!startTime){showToast('Informe data e horário.','error');return}
  if(duration<=0){showToast('Informe a duração do treino.','error');return}
  if((sub.units||[]).length && selectedUnits.length===0){showToast('Marque pelo menos uma parte treinada.','error');return}
  const payload={id:recordId||`${Date.now()}-${Math.random().toString(16).slice(2)}`,axisId,subId,date,startTime,duration,notes,metricValue,units:[...selectedUnits],updatedAt:new Date().toISOString()};
  if(recordId){const i=records.findIndex(r=>String(r.id)===String(recordId));if(i>=0)records[i]=payload}else records.push(payload);
  records.sort((a,b)=>`${a.date} ${a.startTime}`.localeCompare(`${b.date} ${b.startTime}`));save();closeModal();showToast(recordId?'Registro atualizado.':'Treino registrado.');refreshCurrent();
}
function deleteRecord(id){if(!confirm('Excluir este registro?'))return;records=records.filter(r=>String(r.id)!==String(id));save();closeModal();showToast('Registro excluído.');refreshCurrent()}
function refreshCurrent(){if(currentScreen==='home')renderHome();if(currentScreen==='history')renderHistory();if(currentScreen==='progress')renderProgress();if(currentScreen==='more')renderMore()}

function renderHistory(){
  const host=document.getElementById('historyScreen');
  const months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const first=new Date(calendarYear,calendarMonth,1),total=new Date(calendarYear,calendarMonth+1,0).getDate(),start=first.getDay();
  const monthKey=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}`;
  const counts={};records.filter(r=>r.date.startsWith(monthKey)).forEach(r=>counts[r.date]=(counts[r.date]||0)+1);
  let days='';for(let i=0;i<start;i++)days+='<span></span>';for(let d=1;d<=total;d++){const iso=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;days+=`<button class="cal-day ${counts[iso]?'has':''} ${iso===localISO()?'today':''} ${iso===selectedDate?'selected':''}" onclick="selectHistoryDate(${inlineArg(iso)})">${d}</button>`}
  const dayRecords=records.filter(r=>r.date===selectedDate).sort((a,b)=>a.startTime.localeCompare(b.startTime));
  host.innerHTML=`<div class="history-shell"><div class="card calendar-card"><div class="calendar-top"><button class="icon-btn" onclick="changeMonth(-1)">‹</button><div class="calendar-title">${months[calendarMonth]} ${calendarYear}</div><button class="icon-btn" onclick="changeMonth(1)">›</button></div><div class="calendar-grid">${['D','S','T','Q','Q','S','S'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${days}</div></div>
  <div class="card day-summary"><div class="day-summary-head"><div><div class="eyebrow">Dia selecionado</div><h3>${formatDateBR(selectedDate)}</h3></div><div class="day-total">${formatMin(sumDuration(dayRecords))}</div></div>${dayRecords.length?`<div class="timeline">${dayRecords.map(recordCardHTML).join('')}</div>`:`<div class="empty" style="margin-top:12px"><div class="empty-symbol">♪</div>Nenhum treino registrado neste dia.</div>`}</div></div>`;
}
function recordCardHTML(r){const a=axisById(r.axisId),s=subById(r.axisId,r.subId);if(!a||!s)return'';return `<div class="record-card" onclick="openRecordForm(${inlineArg(r.axisId)},${inlineArg(r.subId)},${inlineArg(r.id)})"><div class="record-top"><div><div class="record-axis">Eixo ${a.number} · ${escapeHTML(a.title)}</div><div class="record-title">${escapeHTML(s.name)}</div></div><div class="record-time">${escapeHTML(r.startTime)} · ${formatMin(r.duration)}</div></div><div class="record-meta">${(r.units||[]).map(u=>`<span class="mini-tag">${escapeHTML(u)}</span>`).join('')}${r.metricValue?`<span class="mini-tag gold">${r.metricValue} BPM</span>`:''}</div>${r.notes?`<div class="record-note">${escapeHTML(r.notes)}</div>`:''}</div>`}
function changeMonth(delta){calendarMonth+=delta;if(calendarMonth<0){calendarMonth=11;calendarYear--}if(calendarMonth>11){calendarMonth=0;calendarYear++}const day=selectedDate?.split('-')[2]||'01';selectedDate=`${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${day}`;renderHistory()}
function selectHistoryDate(iso){selectedDate=iso;renderHistory()}

function progressForUnit(sub,unit){const vals=records.filter(r=>r.subId===sub.id&&r.metricValue&&(r.units||[]).includes(unit)).map(r=>Number(r.metricValue));return vals.length?Math.max(...vals):null}
function progressForSub(sub){const vals=records.filter(r=>r.subId===sub.id&&r.metricValue).map(r=>Number(r.metricValue));return vals.length?Math.max(...vals):null}
function renderProgress(){
  const host=document.getElementById('progressScreen');
  const wr=weekRecords(),allMin=sumDuration(records),weekMin=sumDuration(wr);
  const cards=axes.map(axis=>{
    const axisRecords=records.filter(r=>r.axisId===axis.id),axisMin=sumDuration(axisRecords),share=allMin?Math.round(axisMin/allMin*100):0;
    const measured=activeSubs(axis).filter(s=>s.metric==='bpm'&&(s.goals||[]).length);
    const items=measured.length?measured.map(s=>{
      if((s.units||[]).length){return `<div class="progress-item"><div class="progress-item-top"><strong>${escapeHTML(s.name)}</strong><span class="progress-value">por exercício</span></div>${s.units.map(u=>{const best=progressForUnit(s,u);const goals=s.goals||[];return `<div style="margin-top:8px"><div class="progress-item-top"><span style="font-size:9px;color:var(--text-2)">${escapeHTML(u)}</span><span class="progress-value">${best?`${best} BPM`:'—'}</span></div><div class="milestones">${goals.map(g=>`<span class="milestone ${best>=g?'done':''}">${g} BPM</span>`).join('')}</div></div>`}).join('')}</div>`}
      const best=progressForSub(s);return `<div class="progress-item"><div class="progress-item-top"><strong>${escapeHTML(s.name)}</strong><span class="progress-value">${best?`${best} BPM`:'—'}</span></div><div class="milestones">${(s.goals||[]).map(g=>`<span class="milestone ${best>=g?'done':''}">${g} BPM</span>`).join('')}</div></div>`
    }).join(''):`<div class="progress-note">Ainda não há objetivos numéricos definidos neste eixo. Os registros de tempo e frequência continuam sendo contabilizados.</div>`;
    return `<div class="card progress-axis"><div class="progress-head"><div><div class="eyebrow">Eixo ${axis.number}</div><h3>${escapeHTML(axis.title)}</h3></div><span>${formatMin(axisMin)}</span></div><div class="progress-bar"><span style="width:${share}%"></span></div><div class="progress-list">${items}</div></div>`;
  }).join('');
  host.innerHTML=`<div class="card hero"><div class="hero-main"><div><div class="eyebrow">Visão geral</div><h2 class="section-title">Evolução registrada</h2><p class="section-copy">Objetivos numéricos aparecem apenas onde já foram definidos.</p></div><div style="text-align:right"><div class="hero-stat">${formatMin(weekMin)}</div><div class="hero-label">esta semana</div></div></div><div class="hero-metrics"><div class="metric"><b>${formatMin(allMin)}</b><span>tempo total</span></div><div class="metric"><b>${records.length}</b><span>sessões</span></div><div class="metric"><b>${uniqueDays(records)}</b><span>dias</span></div></div></div><div class="progress-grid">${cards}</div>`;
}

function renderMore(){
  document.getElementById('moreScreen').innerHTML=`<div class="more-grid">
    <button class="menu-btn" onclick="openManageCourse()"><strong>Estrutura do curso</strong><span>Adicionar, editar e arquivar subáreas, objetivos em BPM e exercícios internos.</span></button>
    <button class="menu-btn" onclick="openAppearance()"><strong>Aparência</strong><span>Alternar entre verde escuro, preto, azul e amarelo.</span></button>
    <button class="menu-btn" onclick="exportJSON()"><strong>Exportar backup</strong><span>Baixar todos os registros e a estrutura do curso em JSON.</span></button>
    <button class="menu-btn" onclick="document.getElementById('importFile').click()"><strong>Importar backup</strong><span>Mesclar registros e estrutura salvos anteriormente.</span></button>
    <button class="menu-btn" onclick="exportCSV()"><strong>Exportar planilha</strong><span>Baixar os registros em CSV para análise externa.</span></button>
  </div>`;
}
function openManageCourse(){
  showModal('Estrutura do curso',axes.map(a=>`<div class="manage-axis"><div class="manage-axis-head"><strong>Eixo ${a.number} — ${escapeHTML(a.title)}</strong><button onclick="openSubareaEditor(${inlineArg(a.id)})">+ adicionar</button></div>${a.subareas.map(s=>`<div class="manage-row"><div class="manage-row-copy"><b>${escapeHTML(s.name)}</b><span>${s.archived?'Arquivada · ':''}${s.metric==='bpm'?'BPM':'sem métrica numérica'}${(s.goals||[]).length?` · metas ${s.goals.join(' / ')}`:''}</span></div><button class="manage-edit" onclick="openSubareaEditor(${inlineArg(a.id)},${inlineArg(s.id)})">Editar</button></div>`).join('')}</div>`).join(''),'Configuração')
}
function openSubareaEditor(axisId,subId=null){
  const axis=axisById(axisId);const s=subId?subById(axisId,subId):null;
  showModal(s?'Editar subárea':'Nova subárea',`
    <div class="form-label">Nome</div><input id="subName" value="${escapeHTML(s?.name||'')}" placeholder="Nome do conteúdo ou exercício">
    <div class="form-row"><div><div class="form-label">Código</div><input id="subCode" value="${escapeHTML(s?.code||'')}" placeholder="Ex.: 04"></div><div><div class="form-label">Tipo de progresso</div><select id="subMetric"><option value="none" ${s?.metric!=='bpm'?'selected':''}>Sem métrica</option><option value="bpm" ${s?.metric==='bpm'?'selected':''}>BPM</option></select></div></div>
    <div class="form-label">Grupo / descrição</div><input id="subGroup" value="${escapeHTML(s?.group||axis.subtitle)}">
    <div class="form-label">Objetivos <small>separados por vírgula</small></div><input id="subGoals" value="${escapeHTML((s?.goals||[]).join(', '))}" placeholder="Ex.: 80, 100, 120">
    <div class="form-label">Exercícios internos <small>um por linha</small></div><textarea id="subUnits" placeholder="Groove 1\nGroove 2\nGroove 3">${escapeHTML((s?.units||[]).join('\n'))}</textarea>
    <button class="primary" onclick="saveSubarea(${inlineArg(axisId)},${subId?inlineArg(subId):'null'})">Salvar</button>
    ${s?`<div style="height:9px"></div><button class="secondary" onclick="toggleArchiveSubarea(${inlineArg(axisId)},${inlineArg(subId)})">${s.archived?'Reativar':'Arquivar'} subárea</button>`:''}
  `,'Estrutura do curso')
}
function saveSubarea(axisId,subId){
  const axis=axisById(axisId);if(!axis)return;const name=document.getElementById('subName').value.trim();if(!name){showToast('Informe o nome.','error');return}
  const goals=document.getElementById('subGoals').value.split(',').map(x=>Number(x.trim())).filter(x=>Number.isFinite(x)&&x>0).sort((a,b)=>a-b);
  const units=document.getElementById('subUnits').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const data={id:subId||`${axisId}-${Date.now()}`,code:document.getElementById('subCode').value.trim()||'•',name,group:document.getElementById('subGroup').value.trim()||axis.subtitle,metric:document.getElementById('subMetric').value,goals,units,archived:false};
  if(subId){const i=axis.subareas.findIndex(x=>x.id===subId);data.archived=axis.subareas[i]?.archived||false;if(i>=0)axis.subareas[i]=data}else axis.subareas.push(data);save();openManageCourse();showToast('Estrutura atualizada.');refreshCurrent()
}
function toggleArchiveSubarea(axisId,subId){const s=subById(axisId,subId);if(!s)return;s.archived=!s.archived;save();openManageCourse();showToast(s.archived?'Subárea arquivada.':'Subárea reativada.');refreshCurrent()}

function exportJSON(){const data={app:'baixo-plano-mestre',version:2,exportadoEm:new Date().toISOString(),axes,records,appearance:{theme:currentTheme}};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});downloadBlob(blob,'baixo-backup.json');showToast('Backup exportado.')}
function exportCSV(){let csv='Data;Hora;Eixo;Subarea;Unidades;BPM;DuracaoMin;Notas\n';records.forEach(r=>{const a=axisById(r.axisId),s=subById(r.axisId,r.subId);const row=[r.date,r.startTime,a?`Eixo ${a.number} - ${a.title}`:r.axisId,s?.name||r.subId,(r.units||[]).join(' | '),r.metricValue||'',r.duration,`"${String(r.notes||'').replace(/"/g,'""')}"`];csv+=row.join(';')+'\n'});downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'baixo-registros.csv');showToast('Planilha exportada.')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function handleImport(event){const file=event.target.files?.[0];event.target.value='';if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const data=JSON.parse(e.target.result);if(!Array.isArray(data.records)||!Array.isArray(data.axes))throw new Error('Formato inválido');const existing=new Set(records.map(r=>String(r.id)));let added=0;data.records.forEach(r=>{if(!existing.has(String(r.id))){records.push(r);existing.add(String(r.id));added++}});if(confirm('O backup também contém a estrutura do curso. Deseja substituir a estrutura atual pela do backup?'))axes=data.axes;if(data.appearance?.theme&&THEME_META[data.appearance.theme])applyTheme(data.appearance.theme);save();showToast(`${added} registro(s) importado(s).`);refreshCurrent()}catch(err){showToast('Arquivo de backup inválido.','error')}};reader.readAsText(file)}

applyTheme(currentTheme);
showHome();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
